<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.short_name }}</a>
    <nav aria-label="Main">
      <ul class="nav">
        {%- for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    {%- assign ds = site.data.themes %}
    <div class="display">
      <button type="button" class="display__toggle" id="display-toggle" aria-expanded="false" aria-controls="display-panel" aria-label="{{ ds.button }}" title="{{ ds.button }}">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10.3 2.5h3.4l.5 2.6 1.6.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.6 2.6.5v3.4l-2.6.5-.7 1.6 1.5 2.2-2.4 2.4-2.2-1.5-1.6.7-.5 2.6h-3.4l-.5-2.6-1.6-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.6-2.6-.5v-3.4l2.6-.5.7-1.6-1.5-2.2 2.4-2.4 2.2 1.5 1.6-.7z"/><circle cx="12" cy="12" r="3.4"/></svg>
      </button>
      <div class="display__panel" id="display-panel" hidden>
        <fieldset>
          <legend class="label">{{ ds.theme_label }}</legend>
          {%- for t in ds.themes %}
          <label class="display__opt"><input type="radio" name="theme" value="{{ t.key }}"><span class="swatch swatch--{{ t.key }}" aria-hidden="true"></span>{{ t.name }}</label>
          {%- endfor %}
        </fieldset>
        <fieldset>
          <legend class="label">{{ ds.scheme_label }}</legend>
          {%- for t in ds.schemes %}
          <label class="display__opt"><input type="radio" name="scheme" value="{{ t.key }}">{{ t.name }}</label>
          {%- endfor %}
        </fieldset>
      </div>
    </div>
  </div>
</header>

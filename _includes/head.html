<meta charset="utf-8">
<script>
  /* Apply the viewer's saved theme before the page paints (no flash). */
  (function (r) {
    r.className += ' js';
    try {
      var t = localStorage.getItem('site-theme'), s = localStorage.getItem('site-scheme');
      if (t) r.setAttribute('data-theme', t);
      if (s) r.setAttribute('data-scheme', s);
    } catch (e) {}
  })(document.documentElement);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">

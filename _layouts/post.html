---
layout: default
nav: updates
---
<p class="breadcrumb"><a href="{{ '/updates/' | relative_url }}">Updates</a></p>
<article style="margin-top:24px">
  <header>
    <p class="label label--accent">{{ page.category | default: "Update" }}</p>
    <h1 style="margin-top:10px;font-size:clamp(28px,4.5vw,38px);font-weight:600;letter-spacing:-.01em;max-width:820px">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%-d %B %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  </header>
  <div class="prose" style="margin-top:32px">
    {{ content }}
  </div>
</article>
<p class="more" style="margin-top:48px"><a href="{{ '/updates/' | relative_url }}">← All updates</a></p>

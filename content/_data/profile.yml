intro: >-
  My work introduces how near-infrared sensing and machine learning can work
  together to make health monitoring simpler and less invasive. My journey into
  this field began at KUET, where I completed my B.Sc. in Electrical and
  Electronic Engineering in 2025. Since then, this work has led to IEEE
  conference papers and a Q1 journal. Beyond research, I teach microprocessor,
  digital signal processing, digital electronics and few relevant courses at two
  universities in Bangladesh.

# Shown in italics
intro_close: >-
  I find equal fulfillment in exploring new ideas and helping students develop
  the confidence to explore them for themselves.


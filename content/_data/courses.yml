- slug: cse2203
  code: CSE 2203
  title: Microprocessor and Assembly Language
  institution: Bangladesh University
  department: Department of CSE
  kind: Theory
  role: Lecturer
  page: true
  drive_folder: 13InlncTFQ2kLdxyU7UUntfffL2WZ7226
  credits: 3 credits · 3 contact hours/week
  summary: Microprocessor-based system design, memory devices, interrupts, microcontrollers, and the
    Intel 8086 with assembly language programming.
  methods: Lecture and discussion, co-operative and collaborative method, problem-based method.
  assessment: Continuous assessment through class tests, quizzes, assignments and presentations, followed
    by midterm and final examinations. The exam shown against each week is the one that covers it.
  syllabus_note: From the course outline and lesson plan.
  syllabus:
  - heading: Microcomputer system
    text: Microprocessors and microcomputers, evolution of microprocessors, microprocessor applications.
  - heading: Microprocessor-based system design
    text: Hardware and software interfacing in microcomputer system design, hardware and I/O design,
      building, debugging, testing and linking program modules, programming EPROM.
  - heading: Memory devices
    text: Memory terminology, CPU–memory connections, ROM architectures and timing diagrams, different
      types of ROM, flash memory, RAM architectures and timing diagrams, different types of RAM and
      read/write cycle, programmable logic device architectures.
  - heading: Interrupt system
    text: Sources and types of interrupt, handling interrupt requests, interrupt vector and table, 8259A
      priority interrupt controller, daisy chain.
  - heading: Microcontrollers
    text: Microcontroller basics, introduction to microcontroller architecture, operations, families,
      the 8051 microcontroller.
  - heading: Intel 8086 microprocessor
    text: Internal architecture, register structure, programming model, addressing modes, instruction
      set, assembly language programming, condition tests, branches, control structures, subroutines
      and parameter passing, macros, I/O, control signals, I/O port organisation and access, the 8086
      family of chips, interrupts and interrupt handling, coprocessors.
  - heading: System design and other processors
    text: System design using the 8086; overview of the Intel 80186, 80286, 80386, 80486 and Pentium;
      RISC processors; 6800 and 68000 processors.
  - heading: Multiprocessor configurations
    text: Coprocessor configurations, numeric data processor, I/O processors.
  - heading: Assembly language
    text: Program structure and its components, basic instructions, input/output instructions.
  - heading: Flag register and flow control
    text: The flag register, flow control instructions, conditional and unconditional jumps, branching
      and looping structures.
  - heading: Logic and arithmetic operations
    text: Logic, shift and rotate instructions, multiplication and division instructions.
  plan:
  - week: 1
    lectures: 1–3
    topics: 'Microcomputer system: microprocessors and microcomputers, evolution of microprocessors,
      microprocessor applications.'
    exam: Midterm
  - week: 2
    lectures: 4–6
    topics: 'Microprocessor-based system design: hardware and software interfacing in microcomputer
      system design, hardware and I/O design, building.'
    exam: Midterm
  - week: 3
    lectures: 7–9
    topics: Debugging, testing and linking program modules, programming EPROM.
    exam: Midterm
  - week: 4
    lectures: 10–12
    topics: 'Memory devices: memory terminology, CPU–memory connections, ROM architectures and timing
      diagrams.'
    exam: Midterm
  - week: 5
    lectures: 13–15
    topics: Different types of ROM, flash memory, RAM architectures and timing diagrams, different types
      of RAM and read/write cycle, programmable logic device architectures.
    exam: Midterm
  - week: 6
    lectures: 16–18
    topics: 'Interrupt system: sources and types of interrupt, handling interrupt requests, interrupt
      vector and table, 8259A priority interrupt controller, daisy chain.'
    exam: Midterm
  - week: 7
    lectures: 19–21
    topics: 'Microcontrollers: basics, architecture, operations, families, the 8051 microcontroller.'
    exam: Midterm
  - week: 8
    lectures: 22–24
    topics: 'Intel 8086 microprocessor: internal architecture, register structure, programming model,
      addressing modes, instruction set, assembly language programming, condition tests, branches, control
      structures, subroutines and parameter passing.'
    exam: Final
  - week: 9
    lectures: 25–27
    topics: Macros, I/O, control signals, I/O port organisation and access, the 8086 family of chips,
      interrupts and interrupt handling, coprocessors, system design using the 8086.
    exam: Final
  - week: 10
    lectures: 28–30
    topics: 'Overview of the Intel 80186, 80286, 80386, 80486 and Pentium; RISC processors; 6800 and
      68000 processors. Multiprocessor configurations: coprocessor configurations, numeric data processor,
      I/O processors.'
    exam: Final
  - week: 11
    lectures: 31–33
    topics: 'Introduction to assembly language: program structure and its components, basic instructions,
      input/output instructions.'
    exam: Final
  - week: 12
    lectures: 34–36
    topics: 'Flag register and flow control: the flag register, flow control instructions, conditional
      and unconditional jumps, branching and looping structures.'
    exam: Final
  - week: 13
    lectures: 37–39
    topics: 'Logic and arithmetic operations: logic, shift and rotate instructions, multiplication and
      division instructions.'
    exam: Final
  - week: 14
    lectures: 40–42
    topics: Review of previous topics, problem solving, conclusion.
    exam: Final
  books:
  - D. V. Hall, Microprocessors and Interfacing, McGraw-Hill.
  - 'Barry B. Brey, The Intel Microprocessors: 8086/8088, 80186/80188, 80286, 80386, 80486, Pentium
    and Pentium Pro Processor, Architecture, Programming, and Interfacing, Prentice-Hall.'
  - Ytha Yu and Charles Marut, Assembly Language Programming and Organization of the IBM PC, McGraw-Hill.
  sites:

    url: https://www.javatpoint.com/microprocessor

- slug: cse1301
  code: CSE 1301
  title: Physics
  institution: Bangladesh University
  department: Department of CSE
  kind: Theory
  role: Lecturer
  page: true
  drive_folder: 1dGHBXfJMRvOimIZKWHUyVq-8_X8Cnn5q
  credits: 3 credits · 3 contact hours/week
  summary: Electricity and magnetism, electromagnetic induction, modern and nuclear physics, architectural
    acoustics and the quantum theory of radiation.
  methods: Lecture and discussion, co-operative and collaborative method, problem-based method.
  assessment: Continuous assessment through class tests, quizzes, assignments and presentations, followed
    by midterm and final examinations. The exam shown against each week is the one that covers it.
  syllabus_note: From the course outline and lesson plan.
  syllabus:
  - heading: Electricity
    text: Concept of electric charge, conductors and insulators, permittivity of a medium, Coulomb’s
      law, Gauss’s law and its applications.
  - heading: The electric field
    text: Lines of force, electric flux, dipole in an electric field, electric potential, relation between
      electric potential and electric field.
  - heading: Capacitance
    text: Calculation of capacitance, different types of capacitors, capacitors with dielectric, energy
      storage in an electric field, charging and discharging of a capacitor, time constant.
  - heading: Magnetism
    text: Permeability of a medium, the magnetic field, Biot–Savart law, Ampere’s law, magnetic force
      on a current, magnetic lines of induction, force between two parallel current-carrying conductors.
  - heading: Electromagnetic induction
    text: Faraday’s law, Lenz’s law, self and mutual induction, and transient response in an LR circuit.
  - heading: Modern physics
    text: Michelson–Morley experiment, Galilean transformation, special theory of relativity and its
      consequences.
  - heading: Nuclear physics
    text: Properties of the nucleus, nuclear reactions, radioactive disintegration, fission, fusion,
      chain reaction, nuclear reactor.
  - heading: Architectural acoustics
    text: Reverberation and Sabine’s formula.
  - heading: Quantum theory of radiation
    text: Photoelectric effect, Compton effect, wave–particle duality, interpretation of Bohr’s postulates.

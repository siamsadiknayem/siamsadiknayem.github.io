- slug: cse1303
  code: CSE 1303
  title: Electronic Devices and Circuits
  institution: Bangladesh University
  department: Department of CSE
  kind: Theory
  role: Lecturer
  page: true
  drive_folder: 1fIWaraMx7oNbp0NWQTfYAYbGgj5uN9aq
  credits: 3 credits · 3 contact hours/week
  summary: DC and AC circuit analysis, diode circuits, field-effect transistors and thyristors, amplifier
    circuits and frequency response, feedback, and operational amplifiers.
  methods: Lecture and discussion, co-operative and collaborative method, problem-based method.
  assessment: Continuous assessment through class tests, quizzes, assignments and presentations, followed
    by midterm and final examinations. The exam shown against each week is the one that covers it.
  syllabus_note: From the course outline and lesson plan.
  syllabus:
  - heading: DC circuits
    text: KVL, KCL, series and parallel circuits, three-phase circuit, Thevenin’s, Norton’s and superposition
      theorems.
  - heading: AC circuits
    text: Sine wave, RLC circuit, phasor algebra, impedance, vector diagram.
  - heading: Diode applications
    text: Clipper circuit, clamper circuit, Zener diode, photodiode, light-emitting diode, liquid crystal
      display.
  - heading: Field-effect transistors and thyristors
    text: FET construction, different configurations of JFET and characteristics, MOSFET construction
      and characteristics, DC biasing of BJT and FET, SCR, DIAC and Triac.
  - heading: Amplifier circuits
    text: Classification of amplifiers, BJT small-signal CE amplifier with emitter bypass capacitor,
      input and output coupling capacitors, frequency response, bandwidth and gain–bandwidth product,
      design of a CE BJT amplifier, multistage amplifiers, RC, transformer and direct coupling, compound-pair
      amplifiers.
  - heading: Feedback amplifiers
    text: Feedback concept, negative and positive feedback, effect of feedback, different types of negative
      feedback amplifiers and their characteristics.
  - heading: Operational amplifiers
    text: 'Basic differential amplifier, common-mode rejection, ideal op-amp parameters, applications
      of the op-amp: inverting and non-inverting amplifiers, unity-gain buffer, summing amplifier, active
      filters.'
  plan:
  - week: 1
    lectures: 1–2
    topics: Basic electronic circuits, diode and transistor based DC circuit analysis, basic electricity.
    exam: Midterm
  - week: 2
    lectures: 3–4
    topics: Thevenin, Norton and superposition theorems, phasor algebra.
    exam: Midterm
  - week: 3
    lectures: 5–6
    topics: RLC circuit, vector diagram, clipper and clamper circuits.
    exam: Midterm
  - week: 4
    lectures: 7–8
    topics: 'Field-effect transistor (FET): FET construction, different configurations of JFET and characteristics.'
    exam: Midterm
  - week: 5
    lectures: 9–10
    topics: MOSFET construction and characteristics.
    exam: Midterm
  - week: 6
    lectures: 11–12
    topics: DC biasing of BJT and FET. SCR, DIAC and Triac.
    exam: Midterm
  - week: 7
    lectures: 13–14
    topics: 'Transistor equivalent circuits: generalized small-signal hybrid model of CE, CB and CC
      amplifiers.'
    exam: Final
  - week: 8
    lectures: 15–16
    topics: 'Amplifier circuits: classification of amplifiers. BJT small-signal CE amplifier with emitter
      bypass capacitor, input and output coupling capacitors.'
    exam: Final
  - week: 9
    lectures: 17–18
    topics: Frequency response of amplifiers, bandwidth and gain–bandwidth product.
    exam: Final
  - week: 10
    lectures: 19–20
    topics: Design of a CE BJT amplifier. Multistage amplifiers, RC, transformer and direct coupling,
      compound-pair amplifiers.
    exam: Final
  - week: 11
    lectures: 21–22
    topics: 'Feedback amplifiers: feedback concept, negative and positive feedback, effect of feedback.'
    exam: Final
  - week: 12
    lectures: 23–24
    topics: Different types of negative feedback amplifiers and their characteristics.
    exam: Final
  - week: 13
    lectures: 25–26
    topics: 'Operational amplifier: basic differential amplifier, common-mode rejection, ideal op-amp
      parameters, applications of the op-amp.'
    exam: Final
  - week: 14
    lectures: 27–28
    topics: Inverting and non-inverting amplifiers, unity-gain buffer, summing amplifier, active filters.
  books:
  - K. Lal Kishore, Electronic Devices and Circuits, BS Publications.
  - V. K. Mehta and Rohit Mehta, Principles of Electronics.
  - B. L. Theraja and A. K. Theraja, A Textbook of Electrical Technology, Volume IV.
  sites:
  - label: Electronics Notes
    url: https://www.electronics-notes.com
  - label: Electronics Tutorials
    url: https://www.electronics-tutorials.ws

